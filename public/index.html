<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trine · Decisions, decisions…</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/vendor/astronomy.js"></script>
<script src="/vendor/lunar.js"></script>
<script src="/vendor/topojson.js"></script>
<script src="/engine.js"></script>
<script src="/tarot.js"></script>
<style>
:root { --bg:#0e0c1a; --panel:#17142a; --line:#2a2545; --text:#ece8f6; --muted:#9a93b8; --gold:#e8c27a; --accent:#b49cff; --pink:#e98fc4; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 Inter, system-ui, sans-serif; }
.wrap { max-width:1000px; margin:0 auto; padding:28px 16px 70px; }
h1 { font:600 38px/1.1 'Cormorant Garamond', serif; margin:0 0 4px; color:var(--gold); }
h2 { font:600 25px 'Cormorant Garamond', serif; margin:0 0 12px; color:var(--gold); }
h3 { margin:0 0 6px; font-size:15px; }
.sub { color:var(--muted); margin:0 0 24px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
.form { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; align-items:end; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.06em; }
input, textarea, button { width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:#0f0d1e; color:var(--text); font:inherit; }
textarea { min-height:70px; resize:vertical; }
button { background:var(--accent); color:#15102b; border:none; font-weight:600; cursor:pointer; }
button:disabled { opacity:.5; cursor:wait; }
.btnrow { display:flex; gap:10px; margin-top:14px; } .btnrow button { width:auto; padding:10px 22px; }
.status { color:var(--muted); font-size:13px; margin-top:8px; min-height:18px; }
.hidden { display:none !important; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.chip { background:#221d3d; border:1px solid var(--line); border-radius:10px; padding:6px 11px; font-size:14px; }
.chip b { color:var(--gold); }
.chip .x { cursor:pointer; color:var(--muted); margin-left:6px; }
.pillars { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.pillar { background:#221d3d; border-radius:10px; padding:8px 4px; text-align:center; }
.pillar .hz { font-size:24px; color:var(--gold); }
.pillar small { display:block; color:var(--muted); font-size:11px; }
.bar { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:13px; }
.bar span:first-child { width:52px; color:var(--muted); }
.bar i { height:8px; border-radius:5px; display:block; }
#map { width:100%; height:auto; background:#0a0916; border-radius:10px; display:block; }
.note { font-size:12px; color:var(--muted); }
.results div { padding:6px 8px; cursor:pointer; border-radius:6px; font-size:13px; }
.results div:hover { background:#221d3d; }
.q { margin-bottom:14px; } .q p { margin:0 0 6px; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.card { perspective:900px; cursor:pointer; }
.card .inner { position:relative; aspect-ratio:2/3.2; transition:transform .7s; transform-style:preserve-3d; }
.card.flipped .inner { transform:rotateY(180deg); }
.card .face { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; text-align:center; border:1px solid #4a4175; }
.card .back { background:radial-gradient(circle at 50% 40%, #3a2f6e, #16122b 70%); }
.card .back::after { content:'✦'; font-size:42px; color:var(--gold); }
.card .front { background:#1f1a38; transform:rotateY(180deg); }
.card .front .nm { font:600 22px 'Cormorant Garamond', serif; color:var(--gold); margin-bottom:6px; }
.card .front .rv { font-size:11px; color:var(--pink); text-transform:uppercase; letter-spacing:.08em; }
.card .front .kw { font-size:13px; color:var(--muted); margin-top:8px; }
.pos { text-align:center; font-size:12px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.08em; }
.reading .headline { font:600 26px/1.25 'Cormorant Garamond', serif; color:var(--gold); margin:0 0 16px; }
.lens { border-left:3px solid var(--accent); padding:4px 0 4px 12px; margin:12px 0; }
.lens b { color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.08em; display:block; }
.lens.k b { color:var(--pink); } .lens.k { border-color:var(--pink); }
.cost table { width:100%; border-collapse:collapse; font-size:13px; }
.cost td, .cost th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; }
.cost th { color:var(--muted); font-weight:500; }
.steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.steps span { font-size:12px; padding:4px 10px; border-radius:20px; background:#1a1630; color:var(--muted); }
.steps span.on { background:var(--accent); color:#15102b; }
/* ---- reflection game (step 3) ---- */
.rf-head { display:grid; grid-template-columns:minmax(200px,300px) 1fr; gap:18px; align-items:center; margin-bottom:18px; }
.rf-const { width:100%; height:auto; }
.rf-link { stroke:#2e2852; stroke-width:1.2; stroke-dasharray:3 3; transition:stroke .5s; }
.rf-link.lit { stroke:var(--gold); stroke-dasharray:none; }
.rf-star .core { fill:#3a3460; transition:fill .4s; } .rf-star .glow { fill:transparent; transition:fill .5s; }
.rf-star.lit .core { fill:var(--gold); } .rf-star.lit .glow { fill:rgba(232,194,122,.22); animation:twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { fill:rgba(232,194,122,.06); } }
.rf-label { display:flex; justify-content:space-between; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
.rf-label b { color:var(--gold); font-size:15px; letter-spacing:0; }
.rf-bar { height:10px; border-radius:6px; background:#221d3d; overflow:hidden; }
.rf-bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .6s cubic-bezier(.2,.8,.2,1); }
.rf-card { background:#1d1935; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; transition:border-color .3s, box-shadow .3s; }
.rf-card.done { border-color:rgba(232,194,122,.6); box-shadow:0 0 0 1px rgba(232,194,122,.15), 0 0 18px rgba(232,194,122,.08); }
.rf-card.skipped { opacity:.85; }
.rf-qhead { display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
.rf-qhead p { margin:2px 0 0; flex:1; }
.rf-num { flex:none; width:26px; height:26px; border-radius:50%; background:#2b2550; color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:13px; }
.rf-card.done .rf-num { background:var(--gold); color:#1a1430; }
.rf-tag { font-size:11px; color:var(--pink); border:1px solid var(--pink); border-radius:20px; padding:1px 8px; white-space:nowrap; }
.rf-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.rf-actions button { width:auto; padding:7px 12px; font-size:13px; }
.rf-ask { background:linear-gradient(90deg,#3b2f72,#5a3f8f); color:#f3ecff; border:1px solid #6b55b5; }
.rf-skip, .rf-del { background:transparent; color:var(--muted); border:1px solid var(--line); }
.rf-hint { margin-top:10px; padding:10px 12px; border-radius:10px; background:linear-gradient(135deg,rgba(180,156,255,.12),rgba(232,194,122,.08)); border:1px solid rgba(180,156,255,.3); font-size:14px; animation:fadein .5s; }
.rf-hint b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:4px; }
.rf-try { margin-top:6px; color:var(--gold); }
@keyframes fadein { from { opacity:0; transform:translateY(4px); } }
.rf-add, .rf-jar { background:#151229; border:1px dashed #3a3460; border-radius:12px; padding:14px; margin-top:14px; }
.rf-row { display:flex; gap:8px; } .rf-row button { width:auto; padding:10px 16px; white-space:nowrap; }
button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
.rf-jarhead { display:flex; gap:10px; align-items:center; margin-bottom:10px; } .rf-jaricon { font-size:28px; }
.rf-notes { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.rf-note { background:#f3e3b5; color:#2a2140; padding:8px 26px 8px 10px; border-radius:4px; font-size:13px; max-width:240px; position:relative; transform:rotate(var(--r)); box-shadow:0 4px 10px rgba(0,0,0,.35); animation:drop .4s cubic-bezier(.2,1.4,.4,1); }
.rf-note .x { position:absolute; top:4px; right:7px; cursor:pointer; color:#7a6a88; }
@keyframes drop { from { transform:translateY(-14px) rotate(0); opacity:0; } }
.rf-toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--gold); color:#1a1430; font-weight:600; padding:10px 18px; border-radius:30px; opacity:0; pointer-events:none; }
.rf-toast.show { animation:toast 2.2s ease forwards; }
@keyframes toast { 15%,80% { opacity:1; transform:translateX(-50%) translateY(0); } 100% { opacity:0; transform:translateX(-50%) translateY(-8px); } }
#rfToCards:disabled { opacity:.6; cursor:not-allowed; background:#2b2550; color:var(--muted); }
@media (max-width:640px){ .rf-head { grid-template-columns:1fr; } .rf-row { flex-direction:column; } .rf-row button { width:100%; } }
/* ---- brand + tabs ---- */
.brand { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
.tagline { margin:0; font:italic 500 19px 'Cormorant Garamond', serif; color:var(--accent); }
.tabs { display:flex; gap:6px; background:#17142a; border:1px solid var(--line); border-radius:12px; padding:4px; }
.tabs button { width:auto; padding:8px 16px; background:transparent; color:var(--muted); font-weight:500; }
.tabs button.on { background:var(--accent); color:#15102b; }
.tabs button.link { color:var(--muted); font-size:13px; text-decoration:underline; }
/* ---- my chart ---- */
.cv-hero { display:grid; grid-template-columns:1fr minmax(240px,340px); gap:20px; align-items:center; }
.cv-big3 { color:#d8d2ea; margin:4px 0 14px; }
.wheel { width:100%; height:auto; display:block; }
.w-outer { fill:#120f24; stroke:#4a4175; } .w-ring { fill:none; stroke:#3a3460; } .w-tick { stroke:#3a3460; } .w-axis { stroke:var(--gold); stroke-width:1.2; opacity:.7; }
.w-sign { fill:var(--gold); font-size:15px; text-anchor:middle; dominant-baseline:central; }
.w-house { fill:#6b6390; font-size:10px; text-anchor:middle; dominant-baseline:central; }
.w-planet { font-size:17px; text-anchor:middle; dominant-baseline:central; cursor:default; }
.w-lbl { fill:var(--gold); font-size:10px; letter-spacing:.06em; }
.cv-tabs { display:flex; gap:6px; margin:4px 0 12px; flex-wrap:wrap; }
.cv-tabs button { width:auto; padding:8px 14px; background:#17142a; color:var(--muted); border:1px solid var(--line); font-weight:500; }
.cv-tabs button.on { color:var(--gold); border-color:var(--gold); }
.cv-table { width:100%; border-collapse:collapse; font-size:14px; }
.cv-table td, .cv-table th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
.cv-table th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
.cv-table td.g { font-size:18px; width:26px; color:var(--gold); }
.cv-table td:nth-child(2) { white-space:nowrap; }
.cv-pillars { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.cv-pillar { background:#1d1935; border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center; }
.cv-pillar.me { border-color:var(--gold); box-shadow:0 0 16px rgba(232,194,122,.12); }
.cv-pillar small { color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:11px; }
.cv-pillar .hz { font-size:32px; color:var(--gold); margin:4px 0; }
.cv-pillar .el { font-size:13px; }
.cv-pillar p { font-size:12px; color:var(--muted); margin:8px 0 0; }
.cv-dm { margin-top:14px; padding:12px 14px; border-radius:10px; background:linear-gradient(135deg,rgba(232,194,122,.1),rgba(180,156,255,.08)); border:1px solid rgba(232,194,122,.3); }
.cv-dm p { margin:4px 0 0; }
.cv-map { width:100%; height:auto; background:#0a0916; border-radius:10px; display:block; }
.legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); margin-top:10px; align-items:center; }
.legend > span { display:flex; align-items:center; gap:5px; }
.sw { width:14px; height:3px; display:inline-block; border-radius:2px; }
.city { border-top:1px solid var(--line); padding:12px 0; }
.tag { display:inline-block; margin:3px 6px 3px 0; padding:4px 9px; border-radius:20px; background:#221d3d; font-size:13px; }
.tag.venus { background:#3b2140; border:1px solid var(--pink); }
.cv-log { max-height:380px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px 12px; }
.msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:14px; white-space:pre-wrap; animation:fadein .3s; }
.msg.bot { background:#221d3d; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.me { background:var(--accent); color:#15102b; align-self:flex-end; border-bottom-right-radius:4px; }
.msg.typing { color:var(--muted); font-style:italic; }
button.chip { width:auto; cursor:pointer; color:var(--text); font-weight:400; font-size:13px; }
button.chip:hover { border-color:var(--accent); }
.cv-cta { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; background:linear-gradient(135deg,#1e1838,#251c3f); }
@media (max-width:720px){ .cv-hero { grid-template-columns:1fr; } .cv-wheel { max-width:320px; margin:0 auto; } .cv-pillars { grid-template-columns:repeat(2,1fr); } .cv-table td:nth-child(2){ white-space:normal; } }
.back { width:auto; background:transparent; color:var(--muted); border:none; padding:0 0 10px; font-weight:500; font-size:14px; }
.back:hover { color:var(--accent); }
.remember { display:flex; align-items:center; gap:8px; margin-top:12px; text-transform:none; letter-spacing:0; font-size:13px; }
.remember input { width:auto; }
@media (max-width:560px){ .pillars{grid-template-columns:repeat(2,1fr);} .cards{gap:8px;} .card .front .nm{font-size:16px;} h1{font-size:30px;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div><h1 id="brandName">Trine</h1><p class="tagline" id="brandTag">Decisions, decisions…</p></div>
    <nav id="tabs" class="tabs hidden"><button data-v="chart">My chart</button><button data-v="decide">Decide</button><button id="editBirth" class="link">Edit birth data</button></nav>
  </header>
  <p class="sub" id="intro">Three lenses for every choice: saju for <i>when</i>, astrocartography for <i>where</i>, tarot for <i>now</i>.</p>

  <!-- STEP 1 -->
  <section id="s1" class="panel">
    <div class="form">
      <div><label>Your name</label><input id="name" placeholder="Optional" maxlength="40" autocomplete="given-name"></div>
      <div><label>Birth date</label><input id="date" type="date" value="1999-05-31"></div>
      <div><label>Birth time</label><input id="time" type="time" value="14:15"></div>
      <div style="grid-column:span 2;min-width:0"><label>Birth place</label><input id="place" value="Ordu, Turkey" autocomplete="off"><div class="results" id="placeResults"></div></div>
      <div><button id="calc">Show my sky</button></div>
    </div>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember me on this device</label>
    <div class="status" id="status1"></div>
  </section>

  <!-- MY CHART (filled by chart.js) -->
  <section id="chartView" class="hidden"></section>

  <!-- DECIDE -->
  <div id="decideView" class="hidden">
  <div class="steps" id="steps"><span data-s="2">1 Decision</span><span data-s="3">2 Clarity</span><span data-s="4">3 Cards</span><span data-s="5">4 Reading</span></div>

  <!-- STEP 2 -->
  <section id="s2" class="panel hidden">
    <button class="back" data-to="chart">← My chart</button>
    <h2>What are you deciding?</h2>
    <label>In your own words</label>
    <textarea id="decision" placeholder="e.g. Stay in Vienna or move to London next year?"></textarea>
    <div style="margin-top:12px"><label>Places involved (optional)</label><input id="cityQ" placeholder="Add a city…" autocomplete="off"><div class="results" id="cityResults"></div></div>
    <div class="chips" id="placeChips" style="margin-top:10px"></div>
    <svg id="map" viewBox="0 0 1000 500" class="hidden"></svg>
    <div class="btnrow"><button id="toQuestions">Continue</button></div>
    <div class="status" id="status2"></div>
  </section>

  <!-- STEP 3 -->
  <section id="s3" class="panel hidden">
    <button class="back" data-to="2">← Back</button>
    <h2>Find your clarity</h2>
    <div id="reflect"></div>
    <button id="toCards" class="hidden" aria-hidden="true"></button>
  </section>

  <!-- STEP 4 -->
  <section id="s4" class="panel hidden">
    <button class="back" data-to="3">← Back to my answers</button>
    <h2>Draw your cards</h2>
    <p class="note" style="margin-top:-6px">Hold your decision in mind and turn each card.</p>
    <div class="cards" id="cards"></div>
    <div class="btnrow"><button id="toReading" disabled>Get my reading</button></div>
    <div class="status" id="status4"></div>
  </section>

  <!-- STEP 5 -->
  <section id="s5" class="panel hidden reading">
    <button class="back" data-to="4">← Back to the cards</button>
    <div id="reading"></div>
    <div class="btnrow"><button id="newDecision">Start a new decision</button><button class="ghost" data-go="chart">Back to my chart</button></div>
  </section>

  <!-- SUPPORT -->
  <section id="support" class="panel hidden"><h2>Let's pause here</h2><p id="supportMsg"></p></section>
  </div>

  <section id="cost" class="panel cost hidden"><h2 style="font-size:20px">Session cost</h2><div id="costTable"></div></section>
</div>
<script src="/app.js"></script>
<script src="/reflect.js"></script>
<script src="/chart.js"></script>
</body>
</html>
